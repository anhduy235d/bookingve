openapi: 3.0.0
info:
  title: WebXemphim API
  description: API for managing users and movie bookings
  version: 1.0.0

servers:
  - url: http://localhost:5000

paths:
  /user/sigin:
    post:
      summary: User sign-up
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                birthday:
                  type: string
                  format: date
                email:
                  type: string
      responses:
        "200":
          description: Success
        "400":
          description: Bad Request

  /user/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Success
        "400":
          description: Bad Request

  /user/update/pasword:
    post:
      summary: Update user password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Success
        "400":
          description: Bad Request

  /user/update/user/{email}:
    post:
      summary: Update user information
      parameters:
        - in: path
          name: email
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                fullname:
                  type: string
                birthday:
                  type: string
                  format: date
                gender:
                  type: integer
                  description: 1 for male, 0 for female
                city:
                  type: string
                phone:
                  type: string
      responses:
        "200":
          description: Success
        "400":
          description: Bad Request

  /user/info-user:
    post:
      summary: Get user information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
      responses:
        "200":
          description: Success
        "400":
          description: Bad Request
